stages:
  - install
  - test
  - quality
  - deploy

variables:
  BUN_INSTALL: "/root/.bun"
  PATH: "/root/.bun/bin:$PATH"

default:
  image: oven/bun:1
  cache:
    key:
      files:
        - bun.lockb
    paths:
      - node_modules/

install:
  stage: install
  script:
    - bun install --frozen-lockfile
  artifacts:
    paths:
      - node_modules/
    expire_in: 1 hour

lint:
  stage: test
  needs: ["install"]
  script:
    - bun run lint

typecheck:
  stage: test
  needs: ["install"]
  script:
    - bunx tsc --noEmit

build:
  stage: test
  needs: ["install"]
  script:
    - bun run build
  artifacts:
    paths:
      - dist/
      - .output/
    expire_in: 1 day

sonarqube:
  stage: quality
  needs: ["lint", "typecheck", "build"]
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: sonar-cache
    paths:
      - .sonar/cache
  script:
    - sonar-scanner
      -Dsonar.host.url="${SONAR_HOST_URL}"
      -Dsonar.token="${SONAR_TOKEN}"
  allow_failure: true

deploy:
  stage: deploy
  needs: ["sonarqube"]
  when: manual # Manual approval required in GitLab UI
  environment:
    name: production
    url: https://zaheer-hussain.lovable.app
  script:
    - bun install --frozen-lockfile
    - bun run build
    - echo "Deploy step — wire up your hosting provider here (Cloudflare, Vercel, etc.)"
  only:
    - main
